<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Noticias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>📰 Buscador de Noticias Recientes</h1>
  <form id="search-form">
    <input type="text" id="search-input" placeholder="Ej: tecnología, deportes, política" required>
    <button type="submit">Buscar</button>
  </form>
  <div id="news-container"></div>
  <div id="pagination">
    <button id="prev">Anterior</button>
    <button id="next">Siguiente</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
